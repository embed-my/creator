[package]
name = "embed-my-creator"
version = "0.1.0"
description = "Embed My Creator, the desktop app"
authors = ["embed-my"]
license = ""
repository = "https://github.com/embed-my/creator"
edition = "2024"
rust-version = "1.90"

[lib]
name = "embed_my_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-http = "2.8.3"
tauri-plugin-localhost = "2.4.0"
